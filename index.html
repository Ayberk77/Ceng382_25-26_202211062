<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persona_3_week_1</title>
    <link rel="stylesheet" href="./style.css">




</head>
<body onload="startTime()">

    <video autoplay loop muted playsinline id="bg-video">
        <source src="persona3_video.mp4" type="video/mp4">
    </video>

    <div class="logo-container">
        <div class="logo">
            <div class="glowing-line-container">
                <span class="p3">P3</span>
                <div class="persona3">PERSONA3</div>
                <div class="reload">RELOAD</div>
                <div class="glowing-line"></div>
            </div>
        </div>
    </div>
    
      
    <div class="tarot-card" id="tarot-card">
        <div class="card-title">The World</div>
        <div class="card-image"></div>
    </div>
      
    
    
    <div class="glass-container">
        <div class="login-box">
            <h2>Login</h2>
            <form action="#" method="POST">

                <input type="text" id="username" name="username" required placeholder="Username">
                
                <input type="password" id="password" name="password" required placeholder="Password">
                
                <div class="options">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                
                <button type="submit">Login</button>

                <p>Don't have an account? <a href="#" id="register">Register</a></p>
            </form>
        </div>
    </div>


    <script>

        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.querySelector("form");

            loginForm.addEventListener("submit", function (event) {
                event.preventDefault();
                


                loginForm.reset();
            });
        });
    </script>



    <script>
        const video = document.getElementById('bg-video'); 
        // Set the video to start at 2.15 seconds
        video.currentTime = 2.15;
        // Loop the video from 2.15 seconds
        video.addEventListener('timeupdate', function () {
            if (video.currentTime >= video.duration - 0.5) { // Check if we're near the end of the video
                video.currentTime = 2.15; // Reset to 2.15 seconds
            }
        });
    </script>



    </body>
</htmldas
